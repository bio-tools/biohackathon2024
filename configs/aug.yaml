data:
  annotations_path: data/annotated/260226_annotated.csv
  iob_dir: data/IOB_aug
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  random_seed: 42
  augment: true
  augment_n_copies: 3
  include_negatives: false
  biotools_path: biotoolspub/biotoolspub_with_topic.tsv

model:
  pretrained: bioformers/bioformer-16L
  dropout: 0.2
  num_labels: 3

training:
  epochs: 10
  learning_rate: 1.0e-5
  batch_size: 4
  gradient_accumulation_steps: 2
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  output_dir: models/aug
  save_strategy: epoch
  evaluation_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: f1
  seed: 42
  logging_dir: logs/aug
  logging_steps: 250
  early_stopping_patience: 5
