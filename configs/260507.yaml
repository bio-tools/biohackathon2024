data:
  annotations_path: data/annotated/260507_annotated.csv
  iob_dir: data/IOB_260713
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  random_seed: 42
  include_negatives: true

model:
  pretrained: bioformers/bioformer-16L
  dropout: 0.21551453024339556
  num_labels: 3

training:
  epochs: 15
  max_steps: -1
  learning_rate: 1.9671132166486182e-05
  batch_size: 8
  gradient_accumulation_steps: 4
  warmup_ratio: 0.0023270400662623713
  weight_decay: 0.03550623913217163
  label_smoothing_factor: 0.001997687843843394
  bf16: true
  evaluation_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  load_best_model_at_end: true
  metric_for_best_model: eval_f1
  seed: 42
  output_dir: models/training_260713/bioformer
  logging_dir: logs/training_260713/bioformer
  logging_steps: 500
  early_stopping_patience: 3
