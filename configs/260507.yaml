data:
  annotations_path: data/annotated/260507_annotated.csv
  iob_dir: data/IOB_260507
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  random_seed: 42
  include_negatives: true

model:
  pretrained: bioformers/bioformer-16L
  num_labels: 3

training:
  epochs: 15
  max_steps: -1
  learning_rate: 4.736646198682239e-05
  batch_size: 16
  gradient_accumulation_steps: 2
  dropout: 0.2006736705768097
  warmup_ratio: 0.1376903866037737
  weight_decay: 0.013808264225735063
  label_smoothing_factor: 0.2
  bf16: false
  evaluation_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  load_best_model_at_end: true
  metric_for_best_model: f1
  seed: 42
  output_dir: models/260507
  logging_dir: logs/260507
  logging_steps: 250
  early_stopping_patience: 10
