data:
  annotations_path: data/annotated/merged_annotated.csv
  iob_dir: data/IOB
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  random_seed: 42
  augment: false
  augment_n_copies: 1
  include_negatives: false
  biotools_path: biotoolspub/biotoolspub_with_topic.tsv

model:
  pretrained: bioformers/bioformer-16L
  dropout: 0.1
  num_labels: 3

training:
  epochs: 15
  max_steps: -1
  learning_rate: 1e-5
  batch_size: 8
  gradient_accumulation_steps: 2
  warmup_ratio: 0.1
  weight_decay: 0.01
  label_smoothing_factor: 0.05
  bf16: false
  evaluation_strategy: steps
  eval_steps: 250
  save_strategy: steps
  save_steps: 250
  load_best_model_at_end: true
  metric_for_best_model: eval_f1
  seed: 42
  logging_dir: logs/no_aug
  logging_steps: 250
  early_stopping_patience: 3
